<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>今日のラーメン、何にする？</title>
  <link href="https://fonts.googleapis.com/css2?family=Rampart+One&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background-color: #f5c800;
      background-image: url('shop.jpg');
      background-size: 220px auto;
      background-repeat: repeat;
      background-attachment: fixed;
      color: #8b0000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(245, 200, 0, 0.88);
      z-index: 0;
      pointer-events: none;
    }

    header, .container {
      position: relative;
      z-index: 1;
    }

    /* ===== BANNER ===== */
    .banner-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      background: #cc0000;
      overflow: hidden;
    }

    .banner-slider {
      display: flex;
      transition: transform 0.5s ease;
    }

    .banner-slide {
      min-width: 100%;
      padding: 10px 16px;
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      color: #fff8cc;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .banner-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 5px 0;
      background: #aa0000;
    }

    .banner-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,200,0.4);
      transition: background 0.3s;
    }

    .banner-dot.active { background: #fff8cc; }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      padding: 20px 16px 14px;
      text-align: center;
      background: linear-gradient(180deg, #e6b800 0%, #f5c800 100%);
      border-bottom: 3px solid #cc0000;
    }

    header h1 {
      font-size: 2.6rem;
      font-family: 'Rampart One', sans-serif;
      color: #cc0000;
      letter-spacing: 0.1em;
      line-height: 1.2;
      text-shadow: 4px 4px 0px #7a0000, 2px 2px 0px #ff4444;
    }

    header p {
      margin-top: 6px;
      font-size: 0.85rem;
      color: #8b3000;
    }

    /* ===== WEATHER BAR ===== */
    .weather-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #8b3000;
    }

    .weather-bar .weather-icon { font-size: 1.2rem; }
    .weather-bar .weather-hint {
      color: #cc0000;
      font-weight: bold;
    }

    /* ===== STAFF PICK ===== */
    .staff-pick {
      width: 100%;
      max-width: 480px;
      position: relative;
      z-index: 1;
      margin: 16px auto 0;
      padding: 0 16px;
    }

    .staff-pick-card {
      background: #fff8cc;
      border: 2.5px solid #cc0000;
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      gap: 14px;
      align-items: flex-start;
      box-shadow: 0 3px 16px #cc000033;
    }

    .staff-pick-badge {
      background: #cc0000;
      color: #fff8cc;
      font-size: 0.65rem;
      font-weight: bold;
      letter-spacing: 0.08em;
      padding: 4px 10px;
      border-radius: 20px;
      white-space: nowrap;
      margin-top: 2px;
    }

    .staff-pick-body { flex: 1; }

    .staff-pick-name {
      font-size: 1.15rem;
      font-weight: bold;
      color: #cc0000;
      margin-bottom: 4px;
    }

    .staff-pick-comment {
      font-size: 0.8rem;
      color: #5a1000;
      line-height: 1.6;
    }

    .staff-pick-comment .owner-sig {
      display: block;
      margin-top: 6px;
      font-size: 0.72rem;
      color: #cc0000;
    }

    /* ===== CONTAINER ===== */
    .container {
      width: 100%;
      max-width: 480px;
      padding: 24px 16px 48px;
    }

    .step { margin-bottom: 32px; }

    .step-label {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: #cc0000;
      text-transform: uppercase;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .step h2 {
      font-size: 1.05rem;
      color: #7a0000;
      margin-bottom: 14px;
      font-weight: bold;
    }

    .mood-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .mood-btn {
      background: #fff8cc;
      border: 2px solid #e8a000;
      border-radius: 12px;
      padding: 12px 6px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .mood-btn:hover { border-color: #cc0000; background: #fff0aa; }
    .mood-btn.selected { border-color: #cc0000; background: #ffe066; box-shadow: 0 0 12px #cc000033; }
    .mood-btn .emoji { font-size: 1.8rem; }
    .mood-btn .label { font-size: 0.8rem; color: #8b0000; line-height: 1.2; }

    .yesterday-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .yesterday-btn {
      background: #fff8cc;
      border: 2px solid #e8a000;
      border-radius: 10px;
      padding: 10px 8px;
      cursor: pointer;
      font-size: 0.82rem;
      color: #8b0000;
      text-align: center;
      transition: all 0.15s;
    }

    .yesterday-btn:hover { border-color: #cc0000; background: #fff0aa; }
    .yesterday-btn.selected { border-color: #cc0000; background: #ffe066; }

    .or-divider {
      text-align: center;
      font-size: 0.72rem;
      color: #a06020;
      margin: 10px 0;
    }

    input[type="text"] {
      width: 100%;
      background: #fff8cc;
      border: 2px solid #e8a000;
      border-radius: 10px;
      padding: 12px 14px;
      color: #8b0000;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus { border-color: #cc0000; }
    input[type="text"]::placeholder { color: #c8a060; }

    .amount-row { display: flex; gap: 10px; }

    .amount-btn {
      flex: 1;
      background: #fff8cc;
      border: 2px solid #e8a000;
      border-radius: 10px;
      padding: 11px 6px;
      cursor: pointer;
      text-align: center;
      font-size: 0.82rem;
      color: #8b0000;
      transition: all 0.15s;
    }

    .amount-btn:hover { border-color: #cc0000; background: #fff0aa; }
    .amount-btn.selected { border-color: #cc0000; background: #ffe066; }

    .cta-btn {
      width: 100%;
      padding: 16px;
      background: #cc0000;
      border: none;
      border-radius: 14px;
      color: #fff8cc;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      letter-spacing: 0.08em;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 8px;
      font-family: 'Rampart One', sans-serif;
    }

    .cta-btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .cta-btn:active { transform: translateY(0); }
    .cta-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    #result { display: none; margin-top: 32px; }

    .result-card {
      background: #fff8cc;
      border: 2.5px solid #cc0000;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 4px 24px #cc000033;
    }

    .result-card .tag {
      display: inline-block;
      background: #cc0000;
      color: #fff8cc;
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 0.1em;
      padding: 3px 10px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .result-card h3 { font-size: 1.6rem; color: #cc0000; margin-bottom: 4px; font-family: 'Rampart One', sans-serif; }
    .result-card .subtitle { font-size: 0.82rem; color: #8b3000; margin-bottom: 20px; }
    .result-section { margin-bottom: 16px; }

    .result-section .section-title {
      font-size: 0.72rem;
      color: #cc0000;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .topping-list { display: flex; flex-wrap: wrap; gap: 6px; }

    .topping-chip {
      background: #ffe066;
      border: 1.5px solid #e8a000;
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.82rem;
      color: #8b0000;
    }

    .topping-chip.highlight { background: #cc0000; border-color: #aa0000; color: #fff8cc; }

    .amount-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ffe066;
      border: 1.5px solid #e8a000;
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 0.85rem;
      color: #8b0000;
    }

    .reason-box {
      background: #fff0aa;
      border: 1.5px solid #e8a000;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.82rem;
      color: #5a1000;
      line-height: 1.65;
      margin-top: 16px;
      white-space: pre-line;
    }

    .retry-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: transparent;
      border: 2px solid #cc0000;
      border-radius: 12px;
      color: #cc0000;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .retry-btn:hover { background: #fff0aa; border-color: #aa0000; }

    .share-btn {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      background: #000;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.05em;
      transition: background 0.15s, transform 0.1s;
    }

    .share-btn:hover { background: #222; transform: translateY(-1px); }
    .share-btn:active { transform: translateY(0); }

    .share-btn .x-logo {
      font-size: 1.1rem;
      font-weight: 900;
      font-family: serif;
    }

    .share-hint {
      text-align: center;
      font-size: 0.72rem;
      color: #a06020;
      margin-top: 6px;
    }

    .steam {
      display: inline-block;
      animation: steam 2s ease-in-out infinite;
    }

    @keyframes steam {
      0%, 100% { transform: translateY(0) scaleX(1); opacity: 0.8; }
      50% { transform: translateY(-4px) scaleX(0.9); opacity: 1; }
    }
  </style>
</head>
<body>

<!-- ===== BANNER ===== -->
<div class="banner-wrap">
  <div class="banner-slider" id="bannerSlider">
    <!-- バナーはJSで生成 -->
  </div>
  <div class="banner-dots" id="bannerDots"></div>
</div>

<header>
  <h1><span class="steam">🍜</span> 今日のラーメン、何にする？</h1>
  <p>今日の気分と昨日の食事からベストな一杯をおすすめします</p>
  <div class="weather-bar" id="weatherBar">
    <span class="weather-icon">⏳</span>
    <span id="weatherText">天気を取得中…</span>
  </div>
</header>

<!-- ===== STAFF PICK ===== -->
<div class="staff-pick">
  <div class="staff-pick-card">
    <span class="staff-pick-badge">今週の推し</span>
    <div class="staff-pick-body">
      <div class="staff-pick-name" id="pickName">—</div>
      <div class="staff-pick-comment" id="pickComment">—<span class="owner-sig" id="pickSig"></span></div>
    </div>
  </div>
</div>

<div class="container">

  <div class="step">
    <div class="step-label">Step 1</div>
    <h2>今日の気分は？</h2>
    <div class="mood-grid" id="moodGrid">
      <button class="mood-btn" data-mood="tired">
        <span class="emoji">😩</span><span class="label">疲れた・<br>癒されたい</span>
      </button>
      <button class="mood-btn" data-mood="energetic">
        <span class="emoji">💪</span><span class="label">元気いっぱい・<br>がっつり食べたい</span>
      </button>
      <button class="mood-btn" data-mood="hot">
        <span class="emoji">🔥</span><span class="label">辛いもの<br>が食べたい</span>
      </button>
      <button class="mood-btn" data-mood="light">
        <span class="emoji">🌿</span><span class="label">あっさり<br>したい</span>
      </button>
      <button class="mood-btn" data-mood="rich">
        <span class="emoji">😋</span><span class="label">濃厚・<br>こってりが好き</span>
      </button>
      <button class="mood-btn" data-mood="cold">
        <span class="emoji">🥶</span><span class="label">体を<br>温めたい</span>
      </button>
    </div>
  </div>

  <div class="step">
    <div class="step-label">Step 2</div>
    <h2>昨日の夜は何を食べましたか？</h2>
    <div class="yesterday-grid" id="yesterdayGrid">
      <button class="yesterday-btn" data-food="ramen">🍜 ラーメン・麺類</button>
      <button class="yesterday-btn" data-food="meat">🥩 肉料理（焼肉・ステーキ）</button>
      <button class="yesterday-btn" data-food="rice">🍚 和食・ご飯もの</button>
      <button class="yesterday-btn" data-food="light">🥗 サラダ・軽めのもの</button>
      <button class="yesterday-btn" data-food="junk">🍔 ファストフード・ジャンク</button>
      <button class="yesterday-btn" data-food="alcohol">🍺 お酒・つまみ中心</button>
      <button class="yesterday-btn" data-food="nothing">😴 食べなかった</button>
      <button class="yesterday-btn" data-food="other">🍽️ その他</button>
    </div>
    <div class="or-divider">または自由に入力</div>
    <input type="text" id="yesterdayInput" placeholder="例：カレーライス、餃子、お寿司…">
  </div>

  <div class="step">
    <div class="step-label">Step 3</div>
    <h2>今日はどのくらい食べたいですか？</h2>
    <div class="amount-row" id="amountRow">
      <button class="amount-btn" data-amount="small">🥢 少なめ</button>
      <button class="amount-btn" data-amount="normal">🍜 普通</button>
      <button class="amount-btn" data-amount="large">💪 大盛り</button>
      <button class="amount-btn" data-amount="extra">🔥 特盛・おかわり</button>
    </div>
  </div>

  <button class="cta-btn" id="recommendBtn" disabled onclick="recommend()">
    おすすめを見る 🍜
  </button>

  <div id="result">
    <div class="result-card" id="resultCard">
      <span class="tag">TODAY'S RECOMMENDATION</span>
      <h3 id="resRamen">—</h3>
      <div class="subtitle" id="resSubtitle">—</div>

      <div class="result-section">
        <div class="section-title">おすすめトッピング</div>
        <div class="topping-list" id="resToppings"></div>
      </div>

      <div class="result-section">
        <div class="section-title">量・オプション</div>
        <div class="amount-badge" id="resAmount">—</div>
      </div>

      <div class="reason-box" id="resReason">—</div>
    </div>

    <button class="share-btn" id="shareBtn" onclick="shareToX()">
      <span class="x-logo">𝕏</span> 食べたラーメンをポストする
    </button>
    <div class="share-hint">ポストするとトッピング1品無料キャンペーン対象！</div>

    <button class="retry-btn" onclick="reset()">↩ もう一度選び直す</button>
  </div>

</div>

<script>
  // ============================================================
  // ★ オーナー設定エリア ★
  // ここを変えるだけでアプリの内容が変わります
  // ============================================================

  // 【今週の推し】
  const STAFF_PICK = {
    ramen: '豚骨ラーメン',
    comment: '今週は特製タレを仕込み直しました！いつもより深みのある一杯に仕上がってます。ぜひ試してみてください。',
    owner: 'まし屋II 店主より',
    // おすすめを出やすくする重み（0〜5、0=通常、5=最優先）
    boost: { tonkotsu: 4, shoyu: 0, shio: 0, miso: 0, spicy: 0, tsukemen: 0, abura: 0, tantanmen: 0 },
  };

  // 【バナー広告】テキストと絵文字を自由に変えてください
  const BANNERS = [
    { emoji: '🌅', text: '朝ラーメンやってます！！ 営業時間 7:00〜10:00' },
    { emoji: '🎉', text: '今月限定！チャーシュー増量キャンペーン中' },
    { emoji: '🐦', text: 'X（旧Twitter）フォロー＆投稿でトッピング1品無料！' },
    { emoji: '🅿️', text: '駐車場完備・テイクアウトもOKです' },
  ];

  // ============================================================

  // --- Banner ---
  let bannerIdx = 0;
  (function initBanner() {
    const slider = document.getElementById('bannerSlider');
    const dots = document.getElementById('bannerDots');
    BANNERS.forEach((b, i) => {
      const slide = document.createElement('div');
      slide.className = 'banner-slide';
      slide.textContent = `${b.emoji}  ${b.text}`;
      slider.appendChild(slide);

      const dot = document.createElement('div');
      dot.className = 'banner-dot' + (i === 0 ? ' active' : '');
      dots.appendChild(dot);
    });

    setInterval(() => {
      bannerIdx = (bannerIdx + 1) % BANNERS.length;
      slider.style.transform = `translateX(-${bannerIdx * 100}%)`;
      document.querySelectorAll('.banner-dot').forEach((d, i) =>
        d.classList.toggle('active', i === bannerIdx));
    }, 3500);
  })();

  // --- Staff Pick ---
  document.getElementById('pickName').textContent = STAFF_PICK.ramen;
  document.getElementById('pickComment').childNodes[0].textContent = STAFF_PICK.comment;
  document.getElementById('pickSig').textContent = '— ' + STAFF_PICK.owner;

  // --- Weather (Open-Meteo, 米子市両三柳) ---
  // 座標: 35.4333°N, 133.3333°E
  (async function loadWeather() {
    try {
      const res = await fetch(
        'https://api.open-meteo.com/v1/forecast?latitude=35.4333&longitude=133.3333&current=temperature_2m,weathercode&timezone=Asia%2FTokyo'
      );
      const data = await res.json();
      const temp = Math.round(data.current.temperature_2m);
      const code = data.current.weathercode;

      const weatherInfo = interpretWeather(code, temp);
      const bar = document.getElementById('weatherBar');
      bar.querySelector('.weather-icon').textContent = weatherInfo.icon;
      document.getElementById('weatherText').innerHTML =
        `米子市 ${temp}℃ ${weatherInfo.desc}　<span class="weather-hint">${weatherInfo.hint}</span>`;
    } catch {
      document.getElementById('weatherBar').style.display = 'none';
    }
  })();

  function interpretWeather(code, temp) {
    let icon, desc, hint;

    if (code === 0) { icon = '☀️'; desc = '快晴'; }
    else if (code <= 2) { icon = '⛅'; desc = '晴れ時々曇り'; }
    else if (code <= 3) { icon = '☁️'; desc = '曇り'; }
    else if (code <= 48) { icon = '🌫️'; desc = '霧'; }
    else if (code <= 57) { icon = '🌧️'; desc = '霧雨'; }
    else if (code <= 67) { icon = '🌧️'; desc = '雨'; }
    else if (code <= 77) { icon = '🌨️'; desc = '雪'; }
    else if (code <= 82) { icon = '🌦️'; desc = 'にわか雨'; }
    else { icon = '⛈️'; desc = '雷雨'; }

    if (temp <= 5)        hint = '極寒！体を温める味噌・担々麺がおすすめ🔥';
    else if (temp <= 12)  hint = '寒い日は熱いスープで温まろう🍜';
    else if (temp <= 20)  hint = '過ごしやすい気候、どんな一杯も美味しい日！';
    else if (temp <= 28)  hint = '暑い日はあっさり塩・醤油もいいですよ🌿';
    else                  hint = '猛暑！スタミナつけるなら辛味噌・担々麺💪';

    return { icon, desc, hint };
  }

  // --- Selections ---
  let selectedMood = null, selectedFood = null, selectedAmount = null, customFood = '';

  document.getElementById('moodGrid').addEventListener('click', e => {
    const btn = e.target.closest('.mood-btn');
    if (!btn) return;
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedMood = btn.dataset.mood;
    checkReady();
  });

  document.getElementById('yesterdayGrid').addEventListener('click', e => {
    const btn = e.target.closest('.yesterday-btn');
    if (!btn) return;
    document.querySelectorAll('.yesterday-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedFood = btn.dataset.food;
    document.getElementById('yesterdayInput').value = '';
    customFood = '';
    checkReady();
  });

  document.getElementById('yesterdayInput').addEventListener('input', e => {
    customFood = e.target.value.trim();
    if (customFood) {
      document.querySelectorAll('.yesterday-btn').forEach(b => b.classList.remove('selected'));
      selectedFood = 'custom';
    } else {
      selectedFood = null;
    }
    checkReady();
  });

  document.getElementById('amountRow').addEventListener('click', e => {
    const btn = e.target.closest('.amount-btn');
    if (!btn) return;
    document.querySelectorAll('.amount-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedAmount = btn.dataset.amount;
    checkReady();
  });

  function checkReady() {
    document.getElementById('recommendBtn').disabled =
      !(selectedMood && (selectedFood || customFood) && selectedAmount);
  }

  // --- Ramen DB ---
  const ramenDB = {
    tonkotsu:  { name: '豚骨ラーメン',      subtitle: '濃厚クリーミーなスープで心も体も満たされる一杯',          toppings: [{name:'チャーシュー',highlight:true},{name:'半熟卵',highlight:true},{name:'きくらげ'},{name:'ネギ'},{name:'紅しょうが'},{name:'のり'}] },
    shoyu:     { name: '醤油ラーメン',      subtitle: 'キレのあるタレと清澄なスープ、懐かしい味わい',            toppings: [{name:'チャーシュー',highlight:true},{name:'半熟卵',highlight:true},{name:'メンマ'},{name:'ネギ'},{name:'のり'},{name:'なると'}] },
    shio:      { name: '塩ラーメン',        subtitle: '透き通った黄金スープ、素材の旨味が際立つ上品な一杯',      toppings: [{name:'柚子皮',highlight:true},{name:'蒸し鶏チャーシュー',highlight:true},{name:'三つ葉'},{name:'メンマ'},{name:'ねぎ'}] },
    miso:      { name: '味噌ラーメン',      subtitle: '深みのある味噌の香りとコク、寒い日にも体が喜ぶ',          toppings: [{name:'バター',highlight:true},{name:'コーン',highlight:true},{name:'炒め野菜'},{name:'半熟卵'},{name:'豚バラチャーシュー'},{name:'ネギ'}] },
    spicy:     { name: '辛味噌ラーメン',    subtitle: '旨辛スープが体の芯から熱くする、クセになる刺激',          toppings: [{name:'辛子味噌追加',highlight:true},{name:'ニンニク',highlight:true},{name:'粗挽き唐辛子'},{name:'炒め野菜'},{name:'半熟卵'},{name:'チャーシュー'}] },
    tsukemen:  { name: 'つけ麺',            subtitle: '濃厚なつけ汁に極太麺をどっぷり、食べ応え抜群',            toppings: [{name:'麺大盛り',highlight:true},{name:'チャーシュー',highlight:true},{name:'半熟卵'},{name:'メンマ'},{name:'刻みネギ'}] },
    abura:     { name: '油そば / まぜそば', subtitle: 'スープなし・タレと油で和えた濃厚な一杯、最後に酢を！',    toppings: [{name:'卵黄',highlight:true},{name:'ニンニク',highlight:true},{name:'マヨネーズ'},{name:'刻みネギ'},{name:'チャーシュー'}] },
    tantanmen: { name: '担々麺',            subtitle: 'ゴマの香りと旨辛スープ、体を内側から温める一杯',          toppings: [{name:'追いゴマ',highlight:true},{name:'花椒',highlight:true},{name:'挽き肉増量'},{name:'半熟卵'},{name:'青梗菜'}] },
  };

  // --- Scoring ---
  function score(mood, food, amount) {
    const s = { tonkotsu:0, shoyu:0, shio:0, miso:0, spicy:0, tsukemen:0, abura:0, tantanmen:0 };

    // Staff pick boost
    Object.keys(STAFF_PICK.boost).forEach(k => { s[k] += STAFF_PICK.boost[k]; });

    // Mood
    if (mood==='tired')     { s.tonkotsu+=3; s.miso+=3; s.shoyu+=2; s.tantanmen+=1; }
    if (mood==='energetic') { s.tsukemen+=3; s.abura+=3; s.tonkotsu+=2; }
    if (mood==='hot')       { s.spicy+=4; s.tantanmen+=3; }
    if (mood==='light')     { s.shio+=4; s.shoyu+=2; }
    if (mood==='rich')      { s.tonkotsu+=3; s.tsukemen+=2; s.abura+=2; s.tantanmen+=1; }
    if (mood==='cold')      { s.miso+=3; s.tantanmen+=3; s.tonkotsu+=2; }

    // Yesterday
    if (food==='ramen')   { s.shio+=2; s.shoyu+=2; s.miso-=1; s.tonkotsu-=1; }
    if (food==='meat')    { s.shio+=2; s.shoyu+=2; s.miso+=1; }
    if (food==='rice')    { s.tonkotsu+=2; s.tsukemen+=2; s.spicy+=1; }
    if (food==='light')   { s.tonkotsu+=3; s.tsukemen+=2; s.abura+=2; }
    if (food==='junk')    { s.shio+=3; s.shoyu+=2; s.miso+=1; }
    if (food==='alcohol') { s.shio+=3; s.shoyu+=2; s.tonkotsu-=1; }
    if (food==='nothing') { s.tsukemen+=3; s.abura+=2; s.tonkotsu+=2; }

    // Amount
    if (amount==='small') { s.shio+=2; s.shoyu+=1; s.tsukemen-=2; s.abura-=1; }
    if (amount==='large'||amount==='extra') { s.tsukemen+=3; s.abura+=2; s.tonkotsu+=1; }

    return s;
  }

  function pickBest(scores) {
    return Object.entries(scores).sort((a,b) => b[1]-a[1])[0][0];
  }

  function amountText(ramen, amount) {
    if (amount==='small')  return '🥢 麺少なめ（またはハーフサイズ）';
    if (amount==='normal') return '🍜 普通盛り';
    if (amount==='large')  return '💪 大盛り';
    if (amount==='extra')  return (ramen==='tsukemen'||ramen==='abura') ? '🔥 特盛り + 替え玉' : '🔥 特盛り + 替え玉（または丼ライス）';
    return '';
  }

  function buildReason(mood, food, ramen) {
    const moodMap = { tired:'疲れているとき', energetic:'元気いっぱいのとき', hot:'辛いものが食べたいとき', light:'あっさりしたいとき', rich:'こってりが食べたいとき', cold:'体を温めたいとき' };
    const foodMap = { ramen:'昨日麺類を食べた', meat:'昨日肉料理を食べた', rice:'昨日和食だった', light:'昨日あっさりしたものを食べた', junk:'昨日ジャンクフードを食べた', alcohol:'昨日お酒を飲んだ', nothing:'昨日あまり食べなかった', custom:`昨日「${customFood}」を食べた`, other:'昨日その他のものを食べた' };
    const comments = {
      tonkotsu: 'コクのある豚骨スープが疲れた体に染み渡ります。濃厚な旨味でエネルギーチャージ！',
      shoyu:    '醤油のキレあるスープでスッキリと。胃にも優しく、気分をリセットしてくれます。',
      shio:     '透明感のある塩スープが素材の旨味を引き立て、体に負担をかけません。',
      miso:     '味噌の深いコクと香りが体の芯から温めてくれます。野菜との相性も抜群。',
      spicy:    '旨辛スープで汗をかいてスッキリ！刺激が気分を高揚させてくれます。',
      tsukemen: '濃厚なつけ汁に極太麺を絡めてガッツリ。食べ応え満点の一杯です。',
      abura:    'スープなしで麺に直接タレが絡む濃厚な旨味。酢をかけると味変で2度美味しい！',
      tantanmen:'胡麻の香りと辛味が調和した担々麺。体を内側から温め、元気が出ます。',
    };
    return `${moodMap[mood] || ''}・${foodMap[food] || ''}ことを考えると、今日は「${ramenDB[ramen].name}」がベストな選択です！\n\n${comments[ramen]}`;
  }

  function recommend() {
    const food = selectedFood || 'custom';
    const scores = score(selectedMood, food, selectedAmount);
    const best = pickBest(scores);
    const data = ramenDB[best];

    lastRamen = data.name;
    document.getElementById('resRamen').textContent = data.name;
    document.getElementById('resSubtitle').textContent = data.subtitle;

    const toppingEl = document.getElementById('resToppings');
    toppingEl.innerHTML = '';
    data.toppings.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'topping-chip' + (t.highlight ? ' highlight' : '');
      chip.textContent = t.name;
      toppingEl.appendChild(chip);
    });

    document.getElementById('resAmount').textContent = amountText(best, selectedAmount);
    document.getElementById('resReason').textContent = buildReason(selectedMood, food, best);
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  let lastRamen = '';

  function shareToX() {
    const text = `まし屋IIで「${lastRamen}」を食べました🍜\nめちゃくちゃ美味しかった！！\n\n#まし屋II #米子ラーメン #鳥取グルメ #ラーメン好きと繋がりたい`;
    const url = 'https://inobasbussy.github.io/ramen-recommend/';
    const xUrl = `https://x.com/intent/post?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`;
    window.open(xUrl, '_blank');
  }

  function reset() {
    selectedMood = null; selectedFood = null; selectedAmount = null; customFood = '';
    document.querySelectorAll('.mood-btn, .yesterday-btn, .amount-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('yesterdayInput').value = '';
    document.getElementById('recommendBtn').disabled = true;
    document.getElementById('result').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>
</body>
</html>
